<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06111f"/>
      <stop offset="1" stop-color="#10233d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#62f4ff"/>
      <stop offset=".5" stop-color="#31d7e7"/>
      <stop offset="1" stop-color="#4c8ffb"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e38cff"/>
      <stop offset=".5" stop-color="#9b87f5"/>
      <stop offset="1" stop-color="#536dfe"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff08a"/>
      <stop offset=".5" stop-color="#f6c85f"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8affb0"/>
      <stop offset=".5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".48"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="180" cy="160" r="240" fill="#31d7e7" opacity=".05"/>
  <circle cx="1400" cy="850" r="300" fill="#9b87f5" opacity=".06"/>
  <text x="90" y="86" fill="#f5f9ff" font-family="Arial, sans-serif" font-size="42" font-weight="700">Fem ikonforslag til Afgangsprojekt-appen</text>
  <text x="92" y="124" fill="#9eb0c5" font-family="Arial, sans-serif" font-size="20">Neon · 3D-spilstil · AU Informationsteknologi</text>

  <!-- Card 1 -->
  <g transform="translate(80 175)">
    <rect width="450" height="340" rx="38" fill="#10243d" stroke="#31d7e7" stroke-opacity=".38" filter="url(#shadow)"/>
    <g transform="translate(115 36)" filter="url(#glow)">
      <rect x="18" y="105" width="185" height="100" rx="22" fill="#0b192b" stroke="#31d7e7" stroke-width="7"/>
      <rect x="38" y="70" width="165" height="100" rx="20" fill="#102d48" stroke="#58a6ff" stroke-width="7"/>
      <rect x="58" y="35" width="145" height="100" rx="18" fill="#163c59" stroke="url(#cyan)" stroke-width="8"/>
      <path d="M95 82l26 25 49-55" fill="none" stroke="#f5f9ff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="34" y="278" fill="#f5f9ff" font-family="Arial, sans-serif" font-size="27" font-weight="700">1 · Rapporttrappen</text>
    <text x="34" y="312" fill="#9eb0c5" font-family="Arial, sans-serif" font-size="17">Opgaven bygges færdig trin for trin</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(575 175)">
    <rect width="450" height="340" rx="38" fill="#10243d" stroke="#9b87f5" stroke-opacity=".42" filter="url(#shadow)"/>
    <g transform="translate(124 33)" filter="url(#glow)">
      <path d="M101 20l92 48-92 49L9 68z" fill="url(#violet)" stroke="#e7ddff" stroke-width="5"/>
      <path d="M9 68l92 49v102L9 170z" fill="#604fd0" stroke="#bcaeff" stroke-width="5"/>
      <path d="M193 68l-92 49v102l92-49z" fill="#3430a8" stroke="#9b87f5" stroke-width="5"/>
      <path d="M101 20v97M9 68l92 49 92-49" fill="none" stroke="#f5f9ff" stroke-opacity=".65" stroke-width="4"/>
      <circle cx="101" cy="117" r="17" fill="#f6c85f" stroke="#fff4b6" stroke-width="5"/>
    </g>
    <text x="34" y="278" fill="#f5f9ff" font-family="Arial, sans-serif" font-size="27" font-weight="700">2 · Projektkuben</text>
    <text x="34" y="312" fill="#9eb0c5" font-family="Arial, sans-serif" font-size="17">Alle projektets dele samlet i én helhed</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(1070 175)">
    <rect width="450" height="340" rx="38" fill="#10243d" stroke="#f6c85f" stroke-opacity=".42" filter="url(#shadow)"/>
    <g transform="translate(115 30)" filter="url(#glow)">
      <circle cx="110" cy="108" r="96" fill="#111f36" stroke="url(#gold)" stroke-width="10"/>
      <circle cx="110" cy="108" r="61" fill="#172d47" stroke="#fff08a" stroke-width="7"/>
      <circle cx="110" cy="108" r="24" fill="#f6c85f"/>
      <path d="M110 3v27M110 186v27M5 108h27M188 108h27" stroke="#fff6c2" stroke-width="9" stroke-linecap="round"/>
      <path d="M110 108l72-73" stroke="#31d7e7" stroke-width="12" stroke-linecap="round"/>
      <path d="M181 34l-10 31 31-10z" fill="#62f4ff"/>
    </g>
    <text x="34" y="278" fill="#f5f9ff" font-family="Arial, sans-serif" font-size="27" font-weight="700">3 · Fokuspunktet</text>
    <text x="34" y="312" fill="#9eb0c5" font-family="Arial, sans-serif" font-size="17">En præcis problemformulering viser retningen</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(330 555)">
    <rect width="450" height="340" rx="38" fill="#10243d" stroke="#34d399" stroke-opacity=".42" filter="url(#shadow)"/>
    <g transform="translate(115 30)" filter="url(#glow)">
      <path d="M25 40h145c18 0 32 14 32 32v134H57c-18 0-32-14-32-32z" fill="#0d2e3b" stroke="url(#green)" stroke-width="9"/>
      <path d="M57 40v166" stroke="#83ffd0" stroke-width="7"/>
      <path d="M84 78h85M84 111h68M84 144h84" stroke="#f5f9ff" stroke-opacity=".86" stroke-width="9" stroke-linecap="round"/>
      <circle cx="174" cy="173" r="31" fill="#34d399" stroke="#bdffe1" stroke-width="6"/>
      <path d="M161 173l10 10 19-23" fill="none" stroke="#08251e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="34" y="278" fill="#f5f9ff" font-family="Arial, sans-serif" font-size="27" font-weight="700">4 · Vidensbogen</text>
    <text x="34" y="312" fill="#9eb0c5" font-family="Arial, sans-serif" font-size="17">Viden, dokumentation og godkendt resultat</text>
  </g>

  <!-- Card 5 -->
  <g transform="translate(820 555)">
    <rect width="450" height="340" rx="38" fill="#10243d" stroke="#58a6ff" stroke-opacity=".42" filter="url(#shadow)"/>
    <g transform="translate(110 28)" filter="url(#glow)">
      <path d="M112 16L218 69 112 122 6 69z" fill="url(#cyan)" stroke="#c4fbff" stroke-width="6"/>
      <path d="M45 90v52c43 31 91 31 134 0V90" fill="#276bba" stroke="#7edfff" stroke-width="6"/>
      <path d="M205 75v69" stroke="#f6c85f" stroke-width="8" stroke-linecap="round"/>
      <circle cx="205" cy="153" r="12" fill="#f6c85f"/>
      <path d="M112 142c-24 19-40 43-40 70l40-14 40 14c0-27-16-51-40-70z" fill="#9b87f5" stroke="#e1d8ff" stroke-width="5"/>
      <path d="M96 205l16 28 16-28" fill="#fb923c"/>
    </g>
    <text x="34" y="278" fill="#f5f9ff" font-family="Arial, sans-serif" font-size="27" font-weight="700">5 · Afgangsraketten</text>
    <text x="34" y="312" fill="#9eb0c5" font-family="Arial, sans-serif" font-size="17">Legende, energisk og målrettet mod aflevering</text>
  </g>

  <text x="1510" y="970" text-anchor="end" fill="#9eb0c5" font-family="Arial, sans-serif" font-size="15">AI-GENERERET DESIGNUDKAST</text>
</svg>
